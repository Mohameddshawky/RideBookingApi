services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ridebooking-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridebooking-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RideBookingDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      JwtSettings__Key: "ThisIsABigSecretKeyForJwtAuthentication1234567890"
      JwtSettings__Issuer: "RideBookingApi"
      JwtSettings__Audience: "RideBookingApiUsers"
      JwtSettings__ExpiryMinutes: "60"
      Stripe__SecretKey: ""
      Stripe__PublishableKey: ""
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver_data:
